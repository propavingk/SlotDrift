<svg xmlns="http://www.w3.org/2000/svg" width="640" height="176" viewBox="0 0 640 176" role="img" aria-labelledby="sd-banner-title sd-banner-desc">
  <!-- palette: warm paper and ink from the ledger subject; moss for orphaned blocks and one rust accent on the duplicated-slot bracket. contrast against #F7F3EC: ink #33302B 11.5:1, moss #5E6B5A 5.1:1, rust #9C3D12 6.1:1. motion: the report line under the ribbon is typed once per loop, encoding the report being written after the scan; with reduced motion it is fully visible and the banner still reads. every number comes from running the CLI on samples/cluster-window.jsonl. -->
  <title id="sd-banner-title">slotdrift banner: the cluster window and its report line</title>
  <desc id="sd-banner-desc">The slotdrift wordmark, the 61-slot sample window drawn as one cell per slot with skipped slots pale, orphaned slots in moss and a rust bracket under the duplicated slots, and the real report summary line being typed below.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #sd-type-rect { animation: sd-type 6s steps(58) infinite; }
    }
    @keyframes sd-type {
      from { width: 0; }
      to { width: 400; }
    }
  </style>
  <defs>
    <clipPath id="sd-type-clip"><rect id="sd-type-rect" x="128" y="118" width="400" height="16"/></clipPath>
  </defs>
  <rect width="640" height="176" fill="#F7F3EC"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
    <text x="16" y="60" fill="#33302B">slot</text>
    <text x="75" y="60" fill="#9C3D12">drift</text>
  </g>
  <text x="16" y="80" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5E6B5A">continuity, forks, findings</text>

  <text x="128" y="32" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#33302B">61 slots, 64 records</text>

