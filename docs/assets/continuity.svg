  <!-- palette: warm paper and ink, one moss secondary and one rust accent placed on the single thing to look at first, the duplicated-slot bracket. contrast against #F7F3EC: ink #33302B 11.5:1, moss #5E6B5A 5.1:1, rust #9C3D12 6.1:1. Every number comes from running the CLI on samples/cluster-window.jsonl. -->
  <title id="sd-cont-title">Continuity of the 61 slot cluster window</title>
