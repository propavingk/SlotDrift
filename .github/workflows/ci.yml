name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (tests and verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Quality gate
        run: python scripts/verify.py

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --manifest-path engine/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path engine/Cargo.toml

  parity:
    name: Cross-engine parity
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Compare engines on the fixtures
        run: python scripts/parity.py
