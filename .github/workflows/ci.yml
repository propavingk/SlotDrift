name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (tests and verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Quality gate
        run: python scripts/verify.py

  rust:
